apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hamster-strike
  namespace: argocd
spec:
  destination:
    namespace: hamster-strike
    server: https://kubernetes.default.svc
  project: default
  source:
    path: chart
    repoURL: https://github.com/supersidor/hamster-strike.git
    targetRevision: HEAD
    helm:
      releaseName: hamster-strike
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: $ARGOCD_APP_REVISION_SHORT
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
