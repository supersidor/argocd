apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dandydeveloper.github.io/charts
    chart: redis-ha
    targetRevision: 4.39.0
    helm:
      releaseName: redis
      values: |
        fullnameOverride: redis
        replicas: 3
        hardAntiAffinity: true
        auth: false
        persistentVolume:
          enabled: true
          storageClass: ceph-rbd-existing
          size: 5Gi
        redis:
          config:
            min-replicas-to-write: 1
            min-replicas-max-lag: 10
        sentinel:
          quorum: 2
          config:
            down-after-milliseconds: 5000
            failover-timeout: 60000
        haproxy:
          enabled: true
          replicas: 3
          hardAntiAffinity: true
          service:
            type: LoadBalancer
            annotations:
              external-dns.alpha.kubernetes.io/hostname: redis.homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
