apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: redis-cluster
  namespace: redis-cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterSize: 3
  clusterVersion: v8
  persistenceEnabled: true
  hostNetwork: true
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.8.2
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
  redisLeader:
    replicas: 3
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis-cluster-leader
                    - redis-cluster-follower
  redisFollower:
    replicas: 3
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis-cluster-leader
                    - redis-cluster-follower
  storage:
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        storageClassName: ceph-rbd-existing
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-rbd-existing
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
