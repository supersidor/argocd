apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-lb
  namespace: redis-cluster
  annotations:
    external-dns.alpha.kubernetes.io/hostname: redis-cluster.homelab
spec:
  type: LoadBalancer
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
  selector:
    redis_setup_type: cluster
    role: leader
